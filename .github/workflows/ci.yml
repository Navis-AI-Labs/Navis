name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portable contracts/domain and static checks run across host platforms.
  # Database, process and container deployment checks run in the Linux lane.
  validate:
    name: Validate repository (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and contracts
        run: pnpm format:check && pnpm build && pnpm lint && pnpm typecheck && pnpm boundaries && pnpm openspec:validate
      - name: Run portable contract and domain tests
        run: pnpm exec vitest run packages/contracts/test packages/domain/test --coverage.enabled=false
      - name: Verify native setup, launchers and source lint
        run: node --test scripts/test/client-installation.test.mjs scripts/test/instance-setup.test.mjs scripts/test/source-lint.test.mjs
      - name: Install independent client artifact
        run: pnpm instance install-client
      - name: Exercise installed native client and profile isolation
        run: pnpm exec vitest run packages/cli/test/native-client.test.ts --coverage.enabled=false
        env:
          NAVIS_CLI_TEST_ENTRY: ${{ github.workspace }}/.local/bin/navis-entry.mjs

  # Real-database lane: separates from the matrix because GitHub service
  # containers only run on Linux runners. Zero skips are enforced — a
  # Postgres-backed suite that "passes" by skipping is a false green.
  validate-postgres:
    name: Validate against real Postgres (zero skips enforced)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: navis
          POSTGRES_PASSWORD: navis
          POSTGRES_DB: navis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run complete validation against PostgreSQL
        run: pnpm validate
        env:
          DATABASE_URL: postgres://navis:navis@127.0.0.1:5432/navis_test
      - name: Require a successful report with zero skipped tests
        if: always()
        env:
          NAVIS_TEST_REPORT: coverage/test-results.json
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.env.NAVIS_TEST_REPORT, "utf8"));
            if (report.success !== true || !Number.isInteger(report.numTotalTests) || report.numTotalTests < 1 || report.numPendingTests !== 0 || report.numPassedTests !== report.numTotalTests) {
              throw new Error("PostgreSQL validation requires all tests to pass with zero skips");
            }
          '

  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dependencies:audit
